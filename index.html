<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14675F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1418" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Chess for everyone. Play the computer, a friend on the same phone, or a friend online. Learn with puzzles and openings.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
<title>Open Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column of cards on phones; board left, move list and controls right on wide screens.
   Identity: slate-teal board, gold highlights, grotesque display face with a monospaced notation face. */
:root {
  --bg: #E4EAED;
  --surface: #F3F6F7;
  --raised: #FFFFFF;
  --fg: #12212B;
  --muted: #546874;
  --line: #C6D1D7;
  --accent: #14675F;
  --accent-fg: #FFFFFF;
  --accent-soft: #D2E7E3;
  --gold: #E6AA1A;
  --gold-soft: rgba(230, 170, 26, 0.5);
  --gold-strong: rgba(230, 170, 26, 0.85);
  --danger: #B23B2B;
  --ok: #23774A;
  --sq-l: #DDE7E4;
  --sq-d: #6A9895;
  --dot: rgba(18, 33, 43, 0.3);
  --pf-w: #FFFFFF;
  --ps-w: #14222B;
  --pf-b: #2B3640;
  --ps-b: #0A1015;
  --pd-b: #A8B7C2;
  --font-d: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --font-m: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1418; --surface: #131D22; --raised: #19262C; --fg: #E3ECEF; --muted: #8DA2AD; --line: #263840;
    --accent: #52B7B0; --accent-fg: #052321; --accent-soft: #173A3B; --gold: #F0BC3A;
    --gold-soft: rgba(240, 188, 58, 0.42); --gold-strong: rgba(240, 188, 58, 0.8);
    --danger: #E67C6D; --ok: #6CC48E; --sq-l: #A8C3BF; --sq-d: #4A7977; --dot: rgba(6, 18, 22, 0.38);
    --pf-b: #2A343D; --ps-b: #05090C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1418; --surface: #131D22; --raised: #19262C; --fg: #E3ECEF; --muted: #8DA2AD; --line: #263840;
  --accent: #52B7B0; --accent-fg: #052321; --accent-soft: #173A3B; --gold: #F0BC3A;
  --gold-soft: rgba(240, 188, 58, 0.42); --gold-strong: rgba(240, 188, 58, 0.8);
  --danger: #E67C6D; --ok: #6CC48E; --sq-l: #A8C3BF; --sq-d: #4A7977; --dot: rgba(6, 18, 22, 0.38);
  --pf-b: #2A343D; --ps-b: #05090C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 var(--font-b);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 32px;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1040px; margin: 0 auto; }
.view[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-d); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--font-m); }
.muted { color: var(--muted); }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; min-height: 52px; }
.top h2 { font-size: 20px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface); }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.top[data-home="1"] .icon-btn { visibility: hidden; }

/* buttons */
.btn {
  min-height: 44px; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--raised); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.wide { width: 100%; }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* home */
.hero { padding: 8px 0 20px; display: grid; gap: 14px; }
.strip { display: grid; grid-template-columns: repeat(8, 1fr); max-width: 440px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,0.15); }
.strip .sq { aspect-ratio: 1; }
.wordmark { font-size: clamp(44px, 12vw, 76px); line-height: 0.95; font-weight: 800; letter-spacing: -0.035em; font-variation-settings: 'opsz' 96; }
.wordmark span { color: var(--accent); }
.tagline { color: var(--muted); font-size: 18px; max-width: 34ch; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; }
.mode {
  display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; width: 100%;
  background: var(--raised); border: 1.5px solid var(--line); border-radius: 14px; min-height: 84px;
}
.mode:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode .tile { width: 56px; height: 56px; border-radius: 10px; background: var(--sq-d); display: grid; place-items: center; flex: none; }
.mode .tile .pc { width: 44px; height: 44px; }
.mode b { display: block; font: 700 19px var(--font-d); }
.mode small { color: var(--muted); font-size: 14px; display: block; }
.resume { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px; margin-bottom: 12px; background: var(--accent-soft); border-radius: 14px; flex-wrap: wrap; }
.resume b { font-family: var(--font-d); font-size: 17px; display: block; }
.resume small { color: var(--muted); }

/* generic cards and forms */
.card { background: var(--raised); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 640px; }
.label { font: 700 13px var(--font-b); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt b { display: block; font-family: var(--font-d); font-size: 16px; }
.opt small { color: var(--muted); font-size: 14px; }
.opt .num { font: 600 13px var(--font-m); width: 22px; height: 22px; border-radius: 50%; background: var(--line); display: grid; place-items: center; flex: none; }
.field { width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: 600 24px var(--font-m); letter-spacing: 0.25em; text-transform: uppercase; text-align: center; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1.5px dashed var(--line); color: var(--muted); font-size: 15px; }
.err { color: var(--danger); font-weight: 700; min-height: 1.4em; }

/* game layout */
.game { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.game-side { display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (min-width: 880px) {
  .game { grid-template-columns: minmax(0, 580px) minmax(280px, 1fr); gap: 28px; align-items: start; }
}
.player { display: flex; align-items: center; gap: 10px; min-height: 40px; min-width: 0; }
.swatch { width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid var(--ps-w); }
.swatch.w { background: var(--pf-w); }
.swatch.b { background: var(--pf-b); border-color: var(--ps-b); }
.player .pname { font: 700 16px var(--font-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .meta { color: var(--muted); font-size: 14px; white-space: nowrap; }
.caps { display: flex; flex-wrap: wrap; align-items: center; margin-left: auto; min-height: 20px; }
.caps .pc { width: 20px; height: 20px; margin-right: -6px; }
.caps .adv { font: 600 13px var(--font-m); margin-left: 12px; color: var(--muted); }
.board-wrap { position: relative; width: 100%; }
.board {
  display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 0 0 1px rgba(0,0,0,0.18), 0 6px 18px rgba(0,0,0,0.12);
}
.sq { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; --co: var(--sq-d); }
.sq.l { background-color: var(--sq-l); --co: var(--sq-d); }
.sq.d { background-color: var(--sq-d); --co: var(--sq-l); }
.sq::before { content: attr(data-r); position: absolute; left: 3px; top: 1px; font: 600 10px var(--font-m); color: var(--co); pointer-events: none; }
.sq::after { content: attr(data-f); position: absolute; right: 3px; bottom: 1px; font: 600 10px var(--font-m); color: var(--co); pointer-events: none; }
.sq.last { box-shadow: inset 0 0 0 100px var(--gold-soft); }
.sq.sel { box-shadow: inset 0 0 0 100px var(--gold-strong); }
.sq.hint { box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 0 100px var(--gold-soft); }
.sq.tgt { background-image: radial-gradient(circle, var(--dot) 0 21%, transparent 23%); }
.sq.cap { background-image: radial-gradient(circle, transparent 0 60%, var(--dot) 62% 80%, transparent 82%); }
.sq.chk { background-image: radial-gradient(circle, rgba(222, 62, 40, 0.95) 0, rgba(222, 62, 40, 0.55) 40%, rgba(222, 62, 40, 0) 72%); }
.sq.drag .pc { opacity: 0.3; }
.sq.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.pc { width: 88%; height: 88%; pointer-events: none; filter: drop-shadow(0 1.5px 0 rgba(0,0,0,0.28)); display: block; }
.pc.w { --pf: var(--pf-w); --ps: var(--ps-w); --pd: var(--ps-w); }
.pc.b { --pf: var(--pf-b); --ps: var(--ps-b); --pd: var(--pd-b); }
.pc .pg * { fill: var(--pf); stroke: var(--ps); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.pc .pg .dt { fill: none; stroke: var(--pd); stroke-width: 2.4; }
.pc .pg .dx { fill: var(--pd); stroke: none; }
.pc.mv { position: relative; z-index: 6; }
.ghost { position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; will-change: transform; }
.ghost .pc { width: 100%; height: 100%; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.35)); }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 16, 20, 0.58); border-radius: 6px; z-index: 20; padding: 14px; }
.overlay[hidden] { display: none; }
.ocard { background: var(--raised); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; text-align: center; width: min(100%, 330px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
.ocard h3 { font-size: 26px; }
.ocard .sub { color: var(--muted); }
.ocard .row { display: grid; gap: 8px; }
.code { font: 700 38px var(--font-m); letter-spacing: 0.18em; padding: 8px 4px; background: var(--surface); border-radius: 10px; border: 1.5px dashed var(--line); user-select: all; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.promo button { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sq-d); display: grid; place-items: center; padding: 0; }
.promo button:hover { border-color: var(--gold); }
.promo .pc { width: 90%; height: 90%; }
.status { font: 700 20px var(--font-d); display: flex; align-items: center; gap: 10px; min-height: 30px; }
.status::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.status[data-k="wait"]::before { background: var(--muted); animation: pulse 1.2s infinite; }
.status[data-k="check"] { color: var(--danger); }
.status[data-k="check"]::before { background: var(--danger); }
.status[data-k="over"]::before { background: var(--gold); }
@keyframes pulse { 50% { opacity: 0.25; } }
.banner { padding: 12px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 8px; font-weight: 700; }
.banner .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.moves {
  display: flex; flex-wrap: nowrap; gap: 2px 8px; overflow-x: auto; white-space: nowrap; padding: 8px 10px; min-height: 40px;
  background: var(--surface); border-radius: 10px; font: 500 14px var(--font-m); align-items: center; scrollbar-width: thin;
}
.moves .mn { color: var(--muted); margin-left: 6px; }
.moves .mv { padding: 2px 4px; border-radius: 4px; }
.moves .mv.cur { background: var(--gold-soft); }
.moves:empty::before { content: 'Moves appear here'; color: var(--muted); font-family: var(--font-b); }
@media (min-width: 880px) {
  .moves { display: grid; grid-template-columns: 2.6em 1fr 1fr; align-content: start; max-height: 340px; overflow-y: auto; overflow-x: hidden; white-space: normal; gap: 2px 6px; }
  .moves .mn { margin-left: 0; }
}
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }

/* learn */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; max-width: 720px; }
.row-btn { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; background: var(--raised); border: 1.5px solid var(--line); border-radius: 14px; min-height: 68px; }
.row-btn:hover { border-color: var(--accent); }
.row-btn b { font: 700 18px var(--font-d); display: block; }
.row-btn small { color: var(--muted); font-size: 14px; display: block; }
.row-btn .chev { margin-left: auto; width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2.2; stroke-linecap: round; flex: none; }
.row-btn .badge { font: 600 13px var(--font-m); padding: 4px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); flex: none; }
.group-title { font: 700 13px var(--font-b); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 8px 0 -2px; }
.grid-num { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; max-width: 720px; }
.num-btn { aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raised); font: 700 18px var(--font-d); position: relative; }
.num-btn:hover { border-color: var(--accent); }
.num-btn.done { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.num-btn.done::after { content: ''; position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.study-panel { display: grid; gap: 12px; align-content: start; min-width: 0; }
.study-panel h3 { font-size: 24px; }
.tip { color: var(--muted); }
.fb { min-height: 1.5em; font-weight: 700; }
.fb.good { color: var(--ok); }
.fb.bad { color: var(--danger); }
.note { padding: 14px; background: var(--raised); border: 1.5px solid var(--line); border-radius: 12px; min-height: 84px; }
.note b { font-family: var(--font-m); font-weight: 600; margin-right: 6px; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); }
.pieces-tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pieces-tabs button { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid var(--line); background: var(--sq-d); padding: 0; display: grid; place-items: center; }
.pieces-tabs button[aria-checked="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.pieces-tabs .pc { width: 86%; height: 86%; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 700; z-index: 90; max-width: calc(100vw - 32px); text-align: center; }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) {
  .sq.shake, .status[data-k="wait"]::before { animation: none; }
  .mode:hover { transform: none; }
}

/* additions */
.sq.kb { outline: 3px solid var(--gold); outline-offset: -3px; z-index: 2; }
.nav { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.moves button.mv { border: 0; background: none; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.moves button.mv:hover { background: var(--line); }
.moves button.mv.cur:hover { background: var(--gold-soft); }
.row-btn > span:first-child { flex: 1; min-width: 0; }
.row-btn .badge { margin-left: auto; }
.row-btn .badge + .chev { margin-left: 0; }
.opt > span:last-child { min-width: 0; }
.mode > span:last-child { min-width: 0; }
.study-panel .actions { margin-top: 2px; }
.study-panel p { max-width: 52ch; }
.ocard .code { font-size: clamp(28px, 9vw, 38px); }
.moves:empty::before { grid-column: 1 / -1; }

.foot { margin: 22px 0 0; font-size: 14px; color: var(--muted); }
.foot a { color: inherit; font-weight: 700; }

</style>

<script src="config.js"></script>
</head>
<body>
<div class="app">
  <header class="top" id="top" data-home="1">
    <button class="icon-btn" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2 id="title"></h2>
  </header>

  <section class="view" id="v-home">
    <div class="hero">
      <div class="strip" id="strip" aria-hidden="true"></div>
      <h1 class="wordmark">Open<br>Board<span>.</span></h1>
      <p class="tagline">Play the computer, a friend across the table, or someone online. Learn as you go.</p>
    </div>
    <div id="resume"></div>
    <div class="modes" id="modes"></div>
    <p class="foot"><a href="privacy.html">Privacy policy</a></p>
  </section>

  <section class="view" id="v-cpu" hidden>
    <div class="stack">
      <div class="card">
        <div class="label">You play</div>
        <div class="seg" role="radiogroup" aria-label="Your color" id="seg-color">
          <button role="radio" aria-checked="true" data-v="0">White</button>
          <button role="radio" aria-checked="false" data-v="1">Black</button>
          <button role="radio" aria-checked="false" data-v="r">Random</button>
        </div>
        <div class="label">Level</div>
        <div class="opts" role="radiogroup" aria-label="Level" id="opts-level"></div>
        <button class="btn primary wide" id="cpu-start">Start game</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-online" hidden>
    <div class="stack">
      <div class="notice" id="on-note"></div>
      <div class="card" id="on-resume" hidden>
        <div><b id="on-resume-t"></b><div class="muted" style="font-size:14px">You have a game in progress.</div></div>
        <button class="btn primary wide" id="on-resume-btn">Resume game</button>
      </div>
      <div class="card">
        <h3>Create a game</h3>
        <div class="label">You play</div>
        <div class="seg" role="radiogroup" aria-label="Your color online" id="seg-on-color">
          <button role="radio" aria-checked="true" data-v="0">White</button>
          <button role="radio" aria-checked="false" data-v="1">Black</button>
          <button role="radio" aria-checked="false" data-v="r">Random</button>
        </div>
        <button class="btn primary wide" id="on-create">Create game</button>
      </div>
      <div class="card">
        <h3>Join a game</h3>

<script id="s-core">

  Position.prototype.makeNull = function () {

    else if (OL.kind === 'own') note.textContent = 'Play a friend on their own phone. Create a game, send them the code, and moves show up live on both screens. You both need an internet connection.';
    else note.textContent = 'Play a friend on their own phone. Share this app’s link with Contributor access, then send them your game code. Moves show up live on both screens.';
    var can = ok && OL.canWrite !== false;
    ['on-create', 'on-join'].forEach(function (id) { $(id).disabled = !can; });
    $('on-code').disabled = !can;
    var saved = store.get('online');
    $('on-resume').hidden = true;
    if (can && saved && saved.code) {
      OL.db.doc('games/' + saved.code).get().then(function (s) {
        if (!s.exists) { store.del('online'); return; }
        var d = s.data(); if (d.result) { store.del('online'); return; }
        $('on-resume-t').textContent = 'Game ' + saved.code; $('on-resume').hidden = false;
      }, function () { /* offline: leave hidden */ });
    }
  }
  $('on-resume-btn').addEventListener('click', function () {
    var saved = store.get('online'); if (saved) openOnline(saved.code, saved.color);
  });
  $('on-code').addEventListener('input', function () {
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); $('on-err').textContent = '';
  });
  function onErr(msg) { $('on-err').textContent = msg; }
  function dbError(e) {
    var c = e && e.code;
    if (c === 'invalid_argument') return 'You do not have permission to play online. Ask the owner for Contributor access.';
    if (c === 'quota_exceeded') return 'The game store is full. Ask the owner to clear old games.';
    return 'Could not reach the game server. Check your connection and try again.';
  }
  $('on-create').addEventListener('click', function () {
    var btn = this; btn.disabled = true;
    var color = segColor('seg-on-color'), tries = 0;
    function attempt() {
      var code = genCode(), ref = OL.db.doc('games/' + code);
      return ref.get().then(function (s) {
        if (s.exists && tries++ < 5) return attempt();
        var doc = { code: code, startFen: START, moves: [], white: color === 0 ? OL.uid : null, black: color === 1 ? OL.uid : null, result: null, reason: null, drawOffer: null, created: Date.now(), updated: Date.now() };
        return ref.set(doc).then(function () { openOnline(code, color); });
      });
    }
    attempt().catch(function (e) { toast(dbError(e)); }).then(function () { btn.disabled = OL.state !== 'ready'; });
  });
  $('on-join').addEventListener('click', function () {
    var code = $('on-code').value.trim().toUpperCase();
    if (code.length !== 5) { onErr('Enter the 5-character code.'); return; }
    var btn = this; btn.disabled = true; onErr('');
    joinGame(code).catch(function (e) { onErr(e && e.msg ? e.msg : dbError(e)); }).then(function () { btn.disabled = OL.state !== 'ready'; });
  });
  function joinGame(code) {
    var ref = OL.db.doc('games/' + code);
    return ref.get().then(function (s) {
      if (!s.exists) throw { msg: 'No game with that code. Check it and try again.' };
      var d = s.data();
      if (d.white === OL.uid) return openOnline(code, 0);
      if (d.black === OL.uid) return openOnline(code, 1);
      var seat = !d.black ? 'black' : !d.white ? 'white' : null;
      if (!seat) throw { msg: 'That game already has two players.' };
      function claim(retry) {
        return ref.acquire({ holder: OL.uid, ttlMs: 4000 }).then(function (lease) {
          if (!lease.acquired) {
            if (retry) return new Promise(function (r) { setTimeout(r, 800); }).then(function () { return claim(false); });
            throw { msg: 'Someone else is joining right now. Try again in a moment.' };
          }
          return ref.get().then(function (s2) {
            var d2 = s2.data() || {};
            if (d2[seat]) throw { msg: 'That game already has two players.' };
            var patch = { updated: Date.now() }; patch[seat] = OL.uid;
            return ref.update(patch).then(function () { return ref.get(); }).then(function (s3) {
              var d3 = s3.data() || {};
              if (d3[seat] !== OL.uid) throw { msg: 'That game already has two players.' };
            });
          });
        });
      }
      return claim(true).then(function () { openOnline(code, seat === 'white' ? 0 : 1); });
    });
  }
  function openOnline(code, color) {
    store.set('online', { code: code, color: color });
    var ref = OL.db.doc('games/' + code);
    var g = startGame({ mode: 'online', human: color, flip: color === 1, code: code });
    g.ref = ref; g.seats = { w: color === 0 ? OL.uid : null, b: color === 1 ? OL.uid : null };
    g.unsub = ref.onSnapshot(function (snap) {
      if (!G || G.id !== g.id) return;
      if (!snap.exists) { toast('This game no longer exists'); store.del('online'); goBack(); return; }
      adoptDoc(snap.data(), snap.metadata);
    }, function (err) {
      if (G && G.id === g.id) toast(err && err.code === 'revoked' ? 'Access to this game was removed' : 'Lost connection to the game');
    });
    renderGame();
  }
  function adoptDoc(d, meta) {
    G.seats = { w: d.white || null, b: d.black || null };
    G.drawOffer = (d.drawOffer === 0 || d.drawOffer === 1) ? d.drawOffer : null;
    G.result = d.result || null; G.reason = d.reason || null;
    var mv = Array.isArray(d.moves) ? d.moves : [];
    var same = mv.length === G.moves.length && mv.every(function (x, i) { return x === G.moves[i]; });
    if (!same && (mv.length > G.moves.length || !(meta && meta.hasPendingWrites))) {
      G.moves = mv.slice(); rebuild(); G.hint = null; G.promo = null; board.clear();
    }
    renderGame();
  }
  function queueWrite(patch) {
    if (!G || G.mode !== 'online' || !G.ref) return;
    var g = G, p = {}; Object.keys(patch).forEach(function (k) { p[k] = patch[k]; }); p.updated = Date.now();
    g.wq = g.wq.then(function () { return g.ref.update(p); }).catch(function () {
      toast('Could not reach the server. Resyncing…');
      return g.ref.get().then(function (s) { if (G === g && s.exists) adoptDoc(s.data(), s.metadata); }).catch(function () { /* ignore */ });
    });
  }
  function sendMoves() { queueWrite({ moves: G.moves.slice(), drawOffer: null }); }

  /* ---------- learn: shared study board ---------- */
  var S = null, sboard = null, sTimer = 0;
  function studyBoard() {
    if (!sboard) sboard = new Board($('board-study'), {
      targetsFor: function (sq) {
        if (!S || S.kind !== 'puzzle' || S.done || S.busy) return [];
        var p = S.pos.b[sq]; if (!p || (p >> 3) !== S.pos.side) return [];
        var lm = S.pos.legalMoves(), out = [], seen = {};
        lm.forEach(function (m) { if (C.from(m) === sq && !seen[C.to(m)]) { seen[C.to(m)] = 1; out.push({ to: C.to(m), cap: !!(C.flags(m) & C.CAP) }); } });
        return out;
      },
      onMove: puzzleMove
    });
    return sboard;
  }
  function leaveStudy() { S = null; clearTimeout(sTimer); }
  function setStudyBoard(pos, flip, last, hint, enabled) {
    var b = studyBoard(); b.flip = flip; b.enabled = !!enabled;
    b.set({ b: pos.b, last: last || null, check: pos.inCheck() ? pos.ks[pos.side] : -1, hint: hint || null });
  }

  /* ----- learn lists ----- */
  var solved = (store.get('solved') || []);
  function isSolved(fen) { return solved.indexOf(fen) >= 0; }
  function markSolved(fen) { if (!isSolved(fen)) { solved.push(fen); store.set('solved', solved); } }
  var CH = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
  function renderLearn() {
    var done = PUZZLES.filter(function (p) { return isSolved(p.fen); }).length;
    $('learn-list').innerHTML =
      '<button class="row-btn" data-l="pieces"><span><b>How the pieces move</b><small>See every move each piece can make</small></span>' + CH + '</button>' +
      '<button class="row-btn" data-l="basics"><span><b>Special rules</b><small>Castling, en passant and promotion</small></span>' + CH + '</button>' +
      '<button class="row-btn" data-l="openings"><span><b>Openings</b><small>Six classic ways to start a game, move by move</small></span>' + CH + '</button>' +
      '<button class="row-btn" data-l="puzzles"><span><b>Checkmate puzzles</b><small>Find the move that wins the game</small></span><span class="badge">' + done + '/' + PUZZLES.length + '</span>' + CH + '</button>';
  }
  $('learn-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-l]'); if (!b) return;
    var l = b.getAttribute('data-l');
    if (l === 'pieces') openGuide();
    else if (l === 'puzzles') push('puzzles', 'Checkmate puzzles', { refresh: renderPuzzles });
    else push('lessons', l === 'basics' ? 'Special rules' : 'Openings', { refresh: function () { renderLessons(l); } });
  });
  function renderPuzzles() {
    var h = '';
    [1, 2].forEach(function (n) {
      h += '<div class="group-title">Mate in ' + n + '</div><div class="grid-num">';
      PUZZLES.forEach(function (p, i) {
        if (p.n !== n) return;
        h += '<button class="num-btn' + (isSolved(p.fen) ? ' done' : '') + '" data-i="' + i + '" aria-label="Puzzle ' + (i + 1) + (isSolved(p.fen) ? ', solved' : '') + '">' + (i + 1) + '</button>';
      });
      h += '</div>';
    });
    $('puzzle-list').innerHTML = h;
  }
  $('puzzle-list').addEventListener('click', function (e) {
    var b = e.target.closest('.num-btn'); if (b) openPuzzle(parseInt(b.getAttribute('data-i'), 10), true);
  });
  function renderLessons(group) {
    $('lesson-list').innerHTML = LESSONS.filter(function (l) { return l.group === group; }).map(function (l) {
      return '<button class="row-btn" data-id="' + l.id + '"><span><b>' + esc(l.t) + '</b><small class="mono">' + esc(l.sub) + '</small><small>' + esc(l.blurb) + '</small></span>' + CH + '</button>';
    }).join('');
  }
  $('lesson-list').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    openLesson(b.getAttribute('data-id'));
  });

  /* ----- puzzles ----- */
  var solCache = {};
  function solutions(pos, n, key) {
    var k = key + ':' + n;
    if (!solCache[k]) solCache[k] = C.mateMoves(pos, n);
    return solCache[k];
  }
  function openPuzzle(i, pushView) {
    var p = PUZZLES[i], pos = C.Position.fromFEN(p.fen);
    S = { kind: 'puzzle', i: i, pos: pos, n: p.n, rem: p.n, done: false, busy: false, hintStep: 0, fb: '', fbk: '', last: null, hint: null, flip: pos.side === 1 };
    S.sol = solutions(pos, p.n, p.fen);
    if (pushView) push('study', 'Puzzle ' + (i + 1), { leave: leaveStudy });
    else { $('title').textContent = 'Puzzle ' + (i + 1); nav[nav.length - 1].title = 'Puzzle ' + (i + 1); }
    renderPuzzle();
  }
  function renderPuzzle() {
    var p = PUZZLES[S.i], side = S.pos.side;
    setStudyBoard(S.pos, S.flip, S.last, S.hint, !S.done && !S.busy);
    var side0 = C.Position.fromFEN(p.fen).side;
    var h = '<h3>' + esc(p.t) + '</h3><p class="muted">Puzzle ' + (S.i + 1) + ' of ' + PUZZLES.length + ' · Mate in ' + p.n + '</p>' +
      '<p>' + (side0 ? 'Black' : 'White') + ' to move. ' + (S.done ? '' : (S.rem === 1 ? 'Find checkmate in one move.' : 'Find the first move of a forced checkmate in two.')) + '</p>';
    if (S.tipShown && p.tip) h += '<p class="tip">' + esc(p.tip) + '</p>';
    h += '<div class="fb ' + S.fbk + '" role="status">' + esc(S.fb) + '</div><div class="actions">';
    if (S.done) {
      h += (S.i + 1 < PUZZLES.length ? '<button class="btn primary" data-a="next">Next puzzle</button>' : '<button class="btn primary" data-a="list">All puzzles</button>') + '<button class="btn" data-a="restart">Play again</button>';
    } else {
      h += '<button class="btn" data-a="hint"' + (S.busy ? ' disabled' : '') + '>Hint</button><button class="btn" data-a="answer"' + (S.busy ? ' disabled' : '') + '>Show answer</button><button class="btn" data-a="restart">Restart</button>';
    }
    $('study-panel').innerHTML = h + '</div>';
  }
  function puzzleMove(from, to) {
    if (!S || S.kind !== 'puzzle' || S.done || S.busy) return;
    var ms = S.pos.legalMoves().filter(function (m) { return C.from(m) === from && C.to(m) === to; });
    if (!ms.length) return;
    var m = ms[0];
    ms.forEach(function (x) { if (C.promo(x) === C.Q) m = x; });
    if (S.sol.indexOf(m) < 0) {
      S.fb = S.rem === 1 ? 'Not checkmate. Try another move.' : 'That does not force mate. Try another move.'; S.fbk = 'bad';
      renderPuzzle(); studyBoard().shake(from); return;
    }
    S.pos.make(m); S.last = [from, to]; S.hint = null; S.hintStep = 0;
    if (!S.pos.hasLegal() && S.pos.inCheck()) {
      S.done = true; S.fb = 'Checkmate! Puzzle solved.'; S.fbk = 'good'; markSolved(PUZZLES[S.i].fen); renderPuzzle(); return;
    }
    S.rem--; S.busy = true; S.fb = 'Good move. Waiting for the reply…'; S.fbk = 'good'; renderPuzzle();
    var id = S.i;
    sTimer = setTimeout(function () {
      if (!S || S.i !== id) return;
      var lm = S.pos.legalMoves(), r = lm[Math.floor(Math.random() * lm.length)];
      S.pos.make(r); S.last = [C.from(r), C.to(r)];
      S.sol = C.mateMoves(S.pos, 1); S.busy = false; S.fb = 'Now deliver checkmate.'; S.fbk = ''; renderPuzzle();
    }, 650);
  }
  $('study-panel').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b || !S || b.disabled) return;
    var a = b.getAttribute('data-a');
    if (S.kind === 'puzzle') {
      if (a === 'next') openPuzzle(S.i + 1, false);
      else if (a === 'list') goBack();
      else if (a === 'restart') { clearTimeout(sTimer); openPuzzle(S.i, false); }
      else if (a === 'hint') {
        var m = S.sol[0]; S.hintStep++; S.tipShown = true;
        S.hint = S.hintStep === 1 ? [C.from(m), C.from(m)] : [C.from(m), C.to(m)];
        S.fb = S.hintStep === 1 ? 'Move the highlighted piece.' : 'Move it to the highlighted square.'; S.fbk = ''; renderPuzzle();
      } else if (a === 'answer') {
        var m2 = S.sol[0]; S.hint = [C.from(m2), C.to(m2)]; S.fb = 'Answer: ' + C.sanOf(S.pos, m2); S.fbk = ''; S.tipShown = true; renderPuzzle();
      }
    } else if (S.kind === 'lesson') lessonAction(a);
  });

  /* ----- lessons ----- */
  function openLesson(id) {
    var l = LESSONS.filter(function (x) { return x.id === id; })[0];
    var pos = C.Position.fromFEN(l.fen), frames = [{ b: new Int8Array(pos.b), last: null, check: -1, label: '' }], ucis = [];
    var side0 = pos.side;
    l.moves.forEach(function (san) {
      var m = C.parseSan(pos, san), label = (pos.side ? pos.full + '...' : pos.full + '.') + san;
      ucis.push(C.uci(m)); pos.make(m);
      frames.push({ b: new Int8Array(pos.b), last: [C.from(m), C.to(m)], check: pos.inCheck() ? pos.ks[pos.side] : -1, label: label });
    });
    S = { kind: 'lesson', l: l, frames: frames, ucis: ucis, step: 0, flip: side0 === 1, endSide: pos.side };
    push('study', l.t, { leave: leaveStudy });
    renderLesson();
  }
  function renderLesson() {
    var f = S.frames[S.step], l = S.l, n = l.moves.length;
    var b = studyBoard(); b.flip = S.flip; b.enabled = false; b.clear();
    b.set({ b: f.b, last: f.last, check: f.check, hint: null });
    var note = S.step === 0 ? esc(l.intro || l.blurb) + '<br><span class="muted">Press Next to play the first move.</span>' : '<b>' + esc(f.label) + '</b>' + esc(l.notes[S.step - 1]);
    var dots = ''; for (var i = 0; i < n; i++) dots += '<i class="' + (i < S.step ? 'on' : '') + '"></i>';
    var h = '<h3>' + esc(l.t) + '</h3><p class="muted mono">' + esc(l.sub) + '</p><div class="note" aria-live="polite">' + note + '</div><div class="dots" aria-hidden="true">' + dots + '</div><div class="actions">' +
      '<button class="btn" data-a="back"' + (S.step === 0 ? ' disabled' : '') + '>Back</button>';
    if (S.step < n) h += '<button class="btn primary" data-a="step">Next</button>';
    else h += '<button class="btn" data-a="restart">Replay</button>';
    h += '</div>';
    if (S.step === n && l.group === 'openings') h += '<button class="btn primary wide" data-a="play">Play on against the computer</button>';
    $('study-panel').innerHTML = h;
  }
  function lessonAction(a) {
    if (a === 'step') { if (S.step < S.l.moves.length) S.step++; renderLesson(); }
    else if (a === 'back') { if (S.step > 0) S.step--; renderLesson(); }
    else if (a === 'restart') { S.step = 0; renderLesson(); }
    else if (a === 'play') {
      var l = S.l, human = S.endSide, ucis = S.ucis.slice(), start = l.fen;
      startGame({ mode: 'cpu', startFen: start, moves: ucis, human: human, level: 1, flip: human === 1 });
    }
  }

  /* ----- piece guide ----- */
  var GUIDE_FEN = {
    6: 'k7/8/8/8/3K4/8/8/8 w - - 0 1', 5: 'k7/8/8/8/3Q4/8/8/7K w - - 0 1', 4: 'k7/8/8/8/3R4/8/8/7K w - - 0 1',
    3: 'k7/8/8/8/3B4/8/8/7K w - - 0 1', 2: 'k7/8/8/8/3N4/8/8/7K w - - 0 1', 1: 'k7/8/8/8/8/3p1p2/4P3/7K w - - 0 1'
  };
  function openGuide() {
    S = { kind: 'guide', k: 6 };
    push('study', 'How the pieces move', { leave: leaveStudy });
    renderGuide();
  }
  function renderGuide() {
    var k = S.k, pos = C.Position.fromFEN(GUIDE_FEN[k]), sq = 0, i;
    for (i = 0; i < 128; i++) { if (i & 0x88) { i += 7; continue; } if (pos.b[i] === k) sq = i; }
    var b = studyBoard(); b.flip = false; b.enabled = false; b.st = { b: pos.b, last: null, check: -1, hint: null };
    var lm = pos.legalMoves(), t = [], seen = {};
    lm.forEach(function (m) { if (C.from(m) === sq && !seen[C.to(m)]) { seen[C.to(m)] = 1; t.push({ to: C.to(m), cap: !!(C.flags(m) & C.CAP) }); } });
    b.select(sq, t);
    var info = PIECE_INFO.filter(function (x) { return x.k === k; })[0];
    var tabs = PIECE_INFO.map(function (x) {
      return '<button role="radio" aria-checked="' + (x.k === k) + '" data-k="' + x.k + '" aria-label="' + x.name + '">' + pieceHTML(x.k, 0) + '</button>';
    }).join('');
    $('study-panel').innerHTML = '<div class="pieces-tabs" role="radiogroup" aria-label="Piece">' + tabs + '</div><h3>' + info.name + '</h3><p>' + esc(info.text) + '</p>' +
      '<p class="muted">The dots show where the ' + info.name.toLowerCase() + ' can go' + (k === 1 ? ', and the rings show what it can capture.' : '.') + '</p>';
  }
  $('study-panel').addEventListener('click', function (e) {
    var b = e.target.closest('.pieces-tabs button'); if (!b || !S || S.kind !== 'guide') return;
    S.k = parseInt(b.getAttribute('data-k'), 10); renderGuide();
  });

  /* ---------- home ---------- */
  var MODES = [
    { id: 'cpu', t: 'Play the computer', s: 'Five levels, from beginner to master', p: 2 },
    { id: 'local', t: 'Two players', s: 'Pass and play on one device', p: 6 },
    { id: 'online', t: 'Play online', s: 'Share a code and play a friend', p: 3 },
    { id: 'learn', t: 'Learn', s: 'Puzzles, openings and the rules', p: 1 }
  ];
  function buildHome() {
    var order = [4, 2, 3, 5, 6, 3, 2, 4];
    $('strip').innerHTML = order.map(function (t, i) { return '<div class="sq ' + (i % 2 ? 'l' : 'd') + '">' + pieceHTML(t, 0) + '</div>'; }).join('');
    $('modes').innerHTML = MODES.map(function (m) {
      return '<button class="mode" data-m="' + m.id + '"><span class="tile">' + pieceHTML(m.p, 0) + '</span><span><b>' + m.t + '</b><small>' + m.s + '</small></span></button>';
    }).join('');
  }
  function refreshHome() {
    var s = store.get('save'), h = '';
    if (s && s.moves && s.mode && (s.mode === 'local' ? s.moves.length : true)) {
      var mvs = Math.floor(s.moves.length / 2) + 1;
      var what = s.mode === 'cpu' ? 'Vs computer · ' + E.LEVELS[s.level || 0].name : 'Two players';
      h = '<div class="resume"><div><b>Continue your game</b><small>' + esc(what) + ' · move ' + mvs + '</small></div><button class="btn primary" data-a="resume">Continue</button></div>';
    }
    $('resume').innerHTML = h;
  }
  $('resume').addEventListener('click', function (e) {
    if (!e.target.closest('[data-a="resume"]')) return;
    var s = store.get('save'); if (!s) return;
    startGame({ mode: s.mode, startFen: s.startFen, moves: s.moves, human: s.human, level: s.level, flip: s.flip });
  });
  $('modes').addEventListener('click', function (e) {
    var b = e.target.closest('[data-m]'); if (!b) return;
    var m = b.getAttribute('data-m');
    if (m === 'cpu') push('cpu', 'Play the computer', { refresh: renderLevels });
    else if (m === 'local') startGame({ mode: 'local', flip: false });
    else if (m === 'online') push('online', 'Play online', { refresh: renderOnline });
    else push('learn', 'Learn', { refresh: renderLearn });
  });

  if (STANDALONE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline support is optional */ }); });
  }
  buildHome(); renderLevels();
  nav.push({ v: 'home', title: '', refresh: refreshHome }); show('home', ''); refreshHome();
  window.__ob = { get G() { return G; }, goHome: goHome, startGame: startGame };
})();

</script>
</body>
</html>
